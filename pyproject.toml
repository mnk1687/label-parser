[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-parser"
version = "0.4.0"
description = "Local PDF label recognition and extraction"
requires-python = ">=3.10"
dependencies = ["PyMuPDF==1.26.7", "Pillow>=11,<13", "pytesseract==0.3.13", "opencv-python-headless>=4.10,<5", "customtkinter==5.2.2"]

[project.scripts]
label-parser = "label_parser.__main__:main"

[tool.setuptools.packages.find]
include = ["label_parser*"]

[tool.setuptools.package-data]
label_parser = ["*.mjs"]
